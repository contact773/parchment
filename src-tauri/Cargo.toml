[package]
name = "parchment"
version = "0.2.0"
description = "Parchment — a local-first writing studio for novels, scripts, poetry and worldbuilding"
authors = ["GRIN Media"]
edition = "2021"
rust-version = "1.77"

# The default binary is src/main.rs and is named "parchment" (= package name),
# producing parchment.exe on Windows.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
# Desktop-only: focus the existing window instead of opening a second instance
# (two windows on the same IndexedDB would risk last-write-wins data loss).
tauri-plugin-single-instance = "2"
# Signed in-app updates. The public verification key lives in tauri.conf.json;
# the private key exists only in the maintainer's key store and in the
# TAURI_SIGNING_PRIVATE_KEY GitHub Actions secret. See docs/RELEASE.md.
tauri-plugin-updater = "2"
# Restart after an update is installed.
tauri-plugin-process = "2"
# Pin transitive `time`: 0.3.48 added `impl From<HourBase> for <HourBase as ModifierValue>::Type`,
# which current rustc's coherence checker can't normalize — producing spurious E0119 conflicts in
# `cookie` and `tauri-utils`. 0.3.47 is the last good release. Remove once time/rustc resolve this.
time = "=0.3.47"

[profile.release]
# Reasonable release profile: optimized but not punishingly slow to compile.
opt-level = "s"
lto = false
codegen-units = 16
strip = true
