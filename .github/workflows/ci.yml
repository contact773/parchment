# Quality gate. Runs on every pull request and every push to the default
# branch. Publishes nothing, needs no secrets, and must pass before a release
# tag is cut.
name: CI

on:
  # Every branch, so the gate does not depend on what the default branch is
  # called this month. Tag pushes are excluded automatically by filtering on
  # branches at all — those are the release workflow's business.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# One run per ref: a new push cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, tests and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # package.json is the version authority; a release built from files that
      # disagree would ship an installer whose version does not match its
      # updater manifest.
      - name: Version files agree
        run: npm run version:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Web build
        run: npm run build

      - name: No signing material committed
        run: npm run check:secrets

  installer:
    name: Windows installer (unsigned, not published)
    runs-on: windows-latest
    # Proves the desktop bundle still packages. Uses the CI overlay so it does
    # not need — and cannot leak — the updater signing key.
    #
    # A 15-minute Windows build on every push to every working branch is not
    # worth it; on pull requests and on the default branch it is.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build NSIS installer
        run: npm run tauri -- build --config src-tauri/tauri.ci.conf.json

      - name: Upload installer for manual smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: parchment-windows-installer-unsigned
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
